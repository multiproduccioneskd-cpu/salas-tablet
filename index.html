<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background: #f4f6f9; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        .rooms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; flex-grow: 1; }
        
        .room-card { 
            background: white; 
            border-radius: 8px; 
            border: 1px solid #e2e8f0; 
            height: 450px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        .room-title-bar { 
            padding: 15px 20px; 
            border-bottom: 2px solid #1b2a4a; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .room-name { font-weight: bold; color: #1b2a4a; font-size: 18px; }
        .event-count { background: #1b2a4a; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        
        /* SCROLL INTELIGENTE */
        .meetings-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px 20px; 
        }
        
        .meeting-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .time-box { font-weight: bold; color: #555; width: 100px; font-size: 13px; }
        .meeting-title { font-size: 14px; font-weight: bold; color: #2d3748; padding-left: 10px; }
        
        /* BADGE PARPADEANTE */
        .badge-en-curso { background: #d9534f; color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 10px; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="rooms-grid" id="roomsContainer"></div>

    <script>
        let salasMapeadas = {};

        function initSalas() {
            salasMapeadas = {
                "Sala Junta Directiva": { displayName: "Sala Junta Directiva", agenda: [] },
                "Sala 1": { displayName: "Sala 1", agenda: [] },
                "Sala 2": { displayName: "Sala 2", agenda: [] },
                "Sala 3": { displayName: "Sala 3", agenda: [] }
            };
        }

        async function fetchSalasFromAPI() {
            try {
                const response = await fetch(`/api/salas?refresh=${Date.now()}`);
                const data = await response.json();
                if (data && data.value) processSharepointData(data.value);
            } catch (e) { console.error("Error API:", e); }
        }

        function processSharepointData(items) {
            initSalas();
            const ahora = new Date();
            const hoy = ahora.toISOString().split('T')[0];
            const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

            items.sort((a, b) => (parseInt(b.fields?.id || b.id || 0) - parseInt(a.fields?.id || a.id || 0)));

            items.forEach((item, index) => {
                const f = item.fields || item;
                if (!f) return;

                const fechaEvento = (f.HoraInicio || f.Start || "").split('T')[0];
                if (fechaEvento !== hoy) return;

                const inicioStr = (f.HoraInicio || f.Start || "").substring(11, 16);
                const [hI, mI] = inicioStr.split(':').map(Number);
                const inicioMinutos = hI * 60 + mI;
                
                // En curso si estamos entre hora de inicio y 90 min después
                const esEnCurso = (minutosActuales >= inicioMinutos && minutosActuales < (inicioMinutos + 90));

                let salaRaw = String(f.Sala || "").toLowerCase();
                let salaKey = salaRaw.includes("junta") ? "Sala Junta Directiva" : 
                              salaRaw.includes("sala 1") ? "Sala 1" : 
                              salaRaw.includes("sala 2") ? "Sala 2" : 
                              salaRaw.includes("sala 3") ? "Sala 3" : "";

                if (salaKey) {
                    salasMapeadas[salaKey].agenda.push({ 
                        title: (f.Asunto || f.Title || "Actividad").trim(), 
                        startTime: inicioStr,
                        esEnCurso: esEnCurso 
                    });
                }
            });
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            Object.keys(salasMapeadas).forEach(key => {
                const sala = salasMapeadas[key];
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-title-bar">
                            <span class="room-name">${sala.displayName}</span>
                            <span class="event-count">${sala.agenda.length > 0 ? sala.agenda.length + ' Reuniones' : 'Disponible'}</span>
                        </div>
                        <div class="meetings-list">
                            ${sala.agenda.length > 0 ? sala.agenda.map(m => `
                                <div class="meeting-item">
                                    <span class="time-box">${m.startTime}</span>
                                    <div class="meeting-title">${m.title} ${m.esEnCurso ? '<span class="badge-en-curso">EN CURSO</span>' : ''}</div>
                                </div>`).join('') : '<div style="margin-top:100px; text-align:center; color:#999;">No hay reuniones programadas para hoy en esta sala.</div>'}
                        </div>
                    </div>`;
            });
        }
        
        fetchSalasFromAPI();
        setInterval(fetchSalasFromAPI, 15000);
    </script>
</body>
</html>
