<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background: #1b2a4a; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Contenedor principal con 2x2 fijo */
        .rooms-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            gap: 20px; 
            flex-grow: 1; 
            height: 80vh; 
        }
        
        .room-card { 
            background: #f8f9fa; 
            border: 2px solid #1b2a4a; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        .room-title-bar { 
            padding: 15px 20px; 
            background: #fff; 
            border-bottom: 2px solid #1b2a4a; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .meetings-list { 
            flex-grow: 1; 
            overflow-y: auto; /* Scroll interno solo cuando haga falta */
            padding: 10px 20px; 
        }
        
        .meeting-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #dee2e6; }
        .time-box { font-weight: bold; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 15px; }
        .meeting-title { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="rooms-grid" id="roomsContainer"></div>
    
    <script>
        // ... (Tu lógica de processSharepointData y fetch se mantiene igual)

        function renderDashboard() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            const salas = ["Sala Junta Directiva", "Sala 1", "Sala 2", "Sala 3"];
            
            salas.forEach(key => {
                const sala = salasMapeadas[key] || { agenda: [] };
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-title-bar">
                            <span style="font-weight:bold; color:#1b2a4a; font-size:18px;">${key}</span>
                            <span style="font-size:10px; background:#1b2a4a; color:white; padding:2px 8px; border-radius:10px;">
                                ${sala.agenda.length > 0 ? sala.agenda.length + ' Eventos' : 'Disponible'}
                            </span>
                        </div>
                        <div class="meetings-list">
                            ${sala.agenda.length > 0 ? sala.agenda.map(m => `
                                <div class="meeting-item">
                                    <span class="time-box">${m.startTime}</span>
                                    <div class="meeting-title">${m.title} ${m.esEnCurso ? '<span class="badge-en-curso">EN CURSO</span>' : ''}</div>
                                </div>`).join('') : '<div style="margin-top:100px; text-align:center; color:#999;">No hay reuniones programadas para hoy.</div>'}
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
