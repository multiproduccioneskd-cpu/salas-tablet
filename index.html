<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-image: url('FONDO PANTALLA REUNIÓN ALUMNI.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #f4f6f9; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .main-header { background: rgba(27, 42, 74, 0.95); color: #ffffff; padding: 15px 30px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid #dda126; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(48%, 1fr)); gap: 20px; }
        .room-card { background: rgba(255, 255, 255, 0.94); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); border-top: 5px solid #1b2a4a; overflow: hidden; }
        .room-title-bar { background: rgba(248, 249, 250, 0.8); padding: 15px 20px; border-bottom: 1px solid #eef2f5; display: flex; justify-content: space-between; }
        .meetings-list { padding: 15px 20px; max-height: 300px; overflow-y: auto; }
        .meeting-item { padding: 10px 0; border-bottom: 1px solid #edf2f7; }
        .time-box { background: #e2e8f0; padding: 3px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div>
            <h1>Visor de Reuniones UGM</h1>
        </div>
        <div id="liveTime">00:00</div>
    </div>

    <div class="rooms-grid" id="roomsContainer"></div>

    <script>
        // Carga directa y sin filtros
        async function fetchSalas() {
            try {
                const response = await fetch('/api/salas?t=' + Date.now());
                const data = await response.json();
                const items = Array.isArray(data) ? data : (data.value || []);
                
                const salas = {
                    "Sala Junta Directiva": [],
                    "Sala 1": [],
                    "Sala 2": [],
                    "Sala 3": []
                };

                items.forEach(item => {
                    const fields = item.fields || item;
                    // Normalización de nombres de campos (soporta cualquier formato)
                    const sala = (fields.Sala || fields.sala || "").toString();
                    const titulo = (fields.Asunto || fields.Title || fields.title || "Reunión").toString();
                    const hora = (fields.HoraInicio || fields.casillaTiempo || fields.Start || "00:00").toString();
                    
                    let key = "";
                    if (sala.toLowerCase().includes("junta")) key = "Sala Junta Directiva";
                    else if (sala.includes("1")) key = "Sala 1";
                    else if (sala.includes("2")) key = "Sala 2";
                    else if (sala.includes("3")) key = "Sala 3";

                    if (key) {
                        salas[key].push({ titulo, hora });
                    }
                });

                render(salas);
            } catch (e) { console.error(e); }
        }

        function render(salas) {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            
            for (const [nombre, eventos] of Object.entries(salas)) {
                let html = `
                    <div class="room-card">
                        <div class="room-title-bar"><span>${nombre}</span></div>
                        <div class="meetings-list">
                `;
                
                eventos.forEach(ev => {
                    html += `
                        <div class="meeting-item">
                            <span class="time-box">${ev.hora.substring(11, 16)}</span>
                            <span>${ev.titulo}</span>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        setInterval(fetchSalas, 10000);
        fetchSalas();
    </script>
</body>
</html>
