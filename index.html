<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-image: url('FONDO PANTALLA REUNIÓN ALUMNI.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #f4f6f9; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .main-header { background: rgba(27, 42, 74, 0.95); color: #ffffff; padding: 15px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid #dda126; }
        .header-left-block { display: flex; align-items: center; gap: 20px; }
        .header-logo { width: 65px; height: auto; }
        .date-badge { background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: bold; text-align: right; }
        .live-time { color: #52b3e5; display: block; font-size: 16px; }
        
        /* DISEÑO DE TARJETAS FIJAS */
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; flex-grow: 1; }
        .room-card { background: rgba(255, 255, 255, 0.94); border-radius: 8px; border-top: 5px solid #1b2a4a; height: 400px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .room-title-bar { background: rgba(248, 249, 250, 0.8); padding: 15px 20px; border-bottom: 1px solid #eef2f5; display: flex; justify-content: space-between; align-items: center; }
        .meetings-list { padding: 15px 20px; flex-grow: 1; overflow-y: auto; max-height: 320px; }
        
        .meeting-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
        .time-box { background: #e2e8f0; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; min-width: 95px; text-align: center; }
        .meeting-title { font-size: 14px; font-weight: bold; color: #2d3748; padding-left: 15px; }
        
        /* ESTILO EN CURSO */
        .badge-en-curso { background: #d9534f; color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 10px; text-transform: uppercase; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        
        .footer-text { text-align: center; margin-top: 20px; color: #ffffff; font-weight: bold; text-shadow: 1px 1px 3px black; }
    </style>
</head>
<body>
    <div class="main-header">
        <div class="header-left-block">
            <img src="logo-blanco-celeste.png" alt="Logo" class="header-logo">
            <div><div style="font-size:22px; font-weight:bold;">Visor de Reuniones UGM</div></div>
        </div>
        <div class="date-badge">
            <span id="liveDate">Cargando...</span>
            <span id="liveTime" class="live-time">00:00:00</span>
        </div>
    </div>

    <div class="rooms-grid" id="roomsContainer"></div>
    <div class="footer-text">Universidad Gabriela Mistral — Construyendo Nuestra Huella</div>

    <script>
        let salasMapeadas = {};

        function initSalas() {
            salasMapeadas = {
                "Sala Junta Directiva": { displayName: "Sala Junta Directiva", agenda: [] },
                "Sala 1": { displayName: "Sala 1", agenda: [] },
                "Sala 2": { displayName: "Sala 2", agenda: [] },
                "Sala 3": { displayName: "Sala 3", agenda: [] }
            };
        }

        async function fetchSalasFromAPI() {
            try {
                const response = await fetch(`/api/salas?refresh=${Date.now()}`);
                const data = await response.json();
                if (data && data.value) processSharepointData(data.value);
            } catch (e) { console.error("Error API:", e); }
        }

        function processSharepointData(items) {
            initSalas();
            const ahora = new Date();
            const hoy = ahora.toISOString().split('T')[0];
            const minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

            items.sort((a, b) => (parseInt(b.fields?.id || b.id || 0) - parseInt(a.fields?.id || a.id || 0)));

            items.forEach((item, index) => {
                const f = item.fields || item;
                if (!f) return;

                const fechaEvento = (f.HoraInicio || f.Start || "").split('T')[0];
                if (fechaEvento !== hoy) return;

                const inicioStr = (f.HoraInicio || f.Start || "").substring(11, 16);
                const [hI, mI] = inicioStr.split(':').map(Number);
                const inicioMinutos = hI * 60 + mI;
                
                // En curso si: hora actual es >= hora inicio y < hora inicio + 90 min
                const esEnCurso = (minutosActuales >= inicioMinutos && minutosActuales < (inicioMinutos + 90));

                let salaRaw = String(f.Sala || "").toLowerCase();
                let salaKey = salaRaw.includes("junta") ? "Sala Junta Directiva" : 
                              salaRaw.includes("sala 1") ? "Sala 1" : 
                              salaRaw.includes("sala 2") ? "Sala 2" : 
                              salaRaw.includes("sala 3") ? "Sala 3" : "";

                if (salaKey) {
                    salasMapeadas[salaKey].agenda.push({ 
                        title: (f.Asunto || f.Title || "Actividad").trim(), 
                        startTime: inicioStr,
                        esEnCurso: esEnCurso 
                    });
                }
            });
            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            Object.keys(salasMapeadas).forEach(key => {
                const sala = salasMapeadas[key];
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-title-bar">
                            <span style="font-weight:bold; color:#1b2a4a;">${sala.displayName}</span>
                            <span style="font-size:10px; background:#1b2a4a; color:white; padding:2px 6px; border-radius:10px;">${sala.agenda.length} Eventos</span>
                        </div>
                        <div class="meetings-list">
                            ${sala.agenda.length > 0 ? sala.agenda.map(m => `
                                <div class="meeting-item">
                                    <span class="time-box">${m.startTime}</span>
                                    <div class="meeting-title">${m.title} ${m.esEnCurso ? '<span class="badge-en-curso">EN CURSO</span>' : ''}</div>
                                </div>`).join('') : '<div style="text-align:center; color:#999; margin-top:20px;">Sin reuniones hoy</div>'}
                        </div>
                    </div>`;
            });
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('liveDate').innerText = n.toLocaleDateString('es-CL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('liveTime').innerText = n.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }, 1000);
        
        fetchSalasFromAPI();
        setInterval(fetchSalasFromAPI, 15000);
    </script>
</body>
</html>
