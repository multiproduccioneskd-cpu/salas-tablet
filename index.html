<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-image: url('FONDO PANTALLA REUNIÓN ALUMNI.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #f4f6f9; color: #333; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
        .main-header { background: rgba(27, 42, 74, 0.95); color: #ffffff; padding: 15px 30px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid #dda126; }
        .header-logo { width: 65px; height: auto; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(48%, 1fr)); gap: 20px; }
        .room-card { background: rgba(255, 255, 255, 0.94); border-radius: 8px; border-top: 5px solid #1b2a4a; overflow: hidden; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .room-title-bar { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; font-weight: bold; color: #1b2a4a; display: flex; justify-content: space-between; }
        .meeting-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
        .time-box { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="header-left-block">
            <div class="title">Visor de Reuniones UGM</div>
        </div>
        <div class="date-badge">
            <span id="liveDate">Cargando...</span>
            <span id="liveTime" class="live-time">00:00:00</span>
        </div>
    </div>

    <div class="rooms-grid" id="roomsContainer"></div>

    <script>
        let salasMapeadas = {};

        function initSalas() {
            salasMapeadas = {
                "Sala Junta Directiva": { displayName: "Sala Junta Directiva", agenda: [] },
                "Sala 1": { displayName: "Sala 1", agenda: [] },
                "Sala 2": { displayName: "Sala 2", agenda: [] },
                "Sala 3": { displayName: "Sala 3", agenda: [] }
            };
        }

        function formatISODateToHHMM(isoString) {
            if (!isoString) return "00:00";
            try {
                const dateObj = new Date(isoString);
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            } catch (e) { return "00:00"; }
        }

        async function fetchSalasFromAPI() {
            try {
                const response = await fetch(`/api/salas?refresh=${Date.now()}`, { cache: "no-store" });
                const data = await response.json();
                // Maneja tanto el array directo como data.value
                const items = data.value || data;
                if (Array.isArray(items)) {
                    processSharepointData(items);
                }
            } catch (error) {
                console.error("API Error, activando inyección manual...");
            }
        }

        function processSharepointData(items) {
            initSalas();

            // ORDENAMIENTO DE EMERGENCIA: Del más nuevo al más viejo
            items.sort((a, b) => {
                const idA = parseInt(a.fields?.id || a.id || 0);
                const idB = parseInt(b.fields?.id || b.id || 0);
                return idB - idA;
            });

            items.forEach((item, index) => {
                const fields = item.fields || item;
                if (!fields) return;

                const salaRaw = String(fields.Sala || "").toLowerCase();
                const horaInicio = fields.HoraInicio || fields.EventDate || fields.Start || "";
                const horaFin = fields.HoraFin || fields.EndDate || fields.End || "";
                const titulo = (fields.Asunto || fields.Title || "Actividad").trim();

                let salaKey = "";
                if (salaRaw.includes("junta")) salaKey = "Sala Junta Directiva";
                else if (salaRaw.includes("sala 1")) salaKey = "Sala 1";
                else if (salaRaw.includes("sala 2")) salaKey = "Sala 2";
                else if (salaRaw.includes("sala 3")) salaKey = "Sala 3";

                if (salaKey) {
                    salasMapeadas[salaKey].agenda.push({
                        title: titulo,
                        startTime: formatISODateToHHMM(horaInicio),
                        endTime: formatISODateToHHMM(horaFin)
                    });
                }
            });
            renderDashboard();
        }

        window.crearReunionPrueba = function(titulo, salaNombre, hInicio, hFin) {
            const mock = { Sala: salaNombre, Title: titulo, HoraInicio: `2026-06-02T${hInicio}:00Z`, HoraFin: `2026-06-02T${hFin}:00Z` };
            let lista = [];
            Object.keys(salasMapeadas).forEach(k => salasMapeadas[k].agenda.forEach(m => lista.push({Sala: k, Title: m.title, HoraInicio: `2026-06-02T${m.startTime}:00Z`})));
            lista.push(mock);
            processSharepointData(lista);
        };

        function renderDashboard() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            Object.keys(salasMapeadas).forEach(key => {
                const sala = salasMapeadas[key];
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-title-bar"><span>${sala.displayName}</span><span>${sala.agenda.length} Reuniones</span></div>
                        ${sala.agenda.map(m => `
                            <div class="meeting-item">
                                <span class="time-box">${m.startTime}-${m.endTime}</span>
                                <span>${m.title}</span>
                            </div>`).join('')}
                    </div>`;
            });
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('liveDate').innerText = now.toLocaleDateString();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString();
        }, 1000);
        
        fetchSalasFromAPI();
        setInterval(fetchSalasFromAPI, 15000);
    </script>
</body>
</html>
