<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { 
            background-image: url('FONDO PANTALLA REUNIÓN ALUMNI.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-attachment: fixed; min-height: 100vh; display: flex; 
            flex-direction: column; padding: 10px; overflow: hidden; 
        }
        
        .main-header { background: #1b2a4a; color: #ffffff; padding: 8px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-logo { height: 40px; width: auto; } 
        
        .rooms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex-grow: 1; }
        .room-card { background: rgba(255, 255, 255, 0.95); border-radius: 6px; border-top: 4px solid #1b2a4a; height: 350px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .room-title-bar { padding: 8px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .meetings-list { padding: 5px 15px; flex-grow: 1; overflow-y: auto; }
        .meeting-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #f9f9f9; }
        .time-box { background: #e2e8f0; font-size: 10px; padding: 2px 6px; border-radius: 4px; min-width: 50px; text-align: center; }
        .meeting-title { font-size: 12px; font-weight: bold; color: #333; padding-left: 10px; }
        
        .badge-disponible { background: #52b3e5; color: white; font-size: 9px; padding: 2px 8px; border-radius: 10px; }
        .badge-eventos { background: #1b2a4a; color: white; font-size: 9px; padding: 2px 8px; border-radius: 10px; }
        .badge-en-curso { background: #d9534f; color: white; font-size: 8px; padding: 1px 5px; border-radius: 4px; margin-left: 8px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="main-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="logo-blanco-celeste.png" alt="Logo" class="header-logo">
            <div style="font-size:18px; font-weight:bold;">Visor de Reuniones UGM</div>
        </div>
        <div style="text-align:right; font-size:12px;">
            <span id="liveDate"></span>
            <span id="liveTime" style="color:#52b3e5; display:block; font-size:14px;"></span>
        </div>
    </div>
    <div class="rooms-grid" id="roomsContainer"></div>

    <script>
        const getChileanDate = () => new Date(new Date().toLocaleString("en-US", {timeZone: "America/Santiago"}));

        async function fetchSalasFromAPI() {
            try {
                const response = await fetch(`/api/salas?refresh=${Date.now()}`);
                const data = await response.json();
                renderDashboard(processSharepointData(data.value || []));
            } catch (e) { console.error("Error API:", e); }
        }

        function processSharepointData(items) {
            const ahora = getChileanDate();
            const tiempoAhora = ahora.getTime();
            const hoyStr = ahora.toLocaleDateString('es-CL');
            const salas = { "Sala Junta Directiva": [], "Sala 1": [], "Sala 2": [], "Sala 3": [] };

            items.forEach(item => {
                const f = item.fields || item;
                if (!f.HoraInicio) return;
                
                const inicio = new Date(f.HoraInicio);
                // Si HoraFin no existe, damos 1 hora de duración
                const fin = f.HoraFin ? new Date(f.HoraFin) : new Date(inicio.getTime() + 60 * 60000);

                // 1. Solo reuniones de hoy
                if (inicio.toLocaleDateString('es-CL') !== hoyStr) return;

                // 2. Borrar reuniones pasadas: si terminaron hace más de 5 minutos, descartar
                if (fin.getTime() < (tiempoAhora - (5 * 60000))) return;

                const esEnCurso = (tiempoAhora >= inicio.getTime() && tiempoAhora <= fin.getTime());
                
                let s = String(f.Sala || "").toLowerCase();
                let key = s.includes("junta") ? "Sala Junta Directiva" : 
                          s.includes("sala 1") ? "Sala 1" : 
                          s.includes("sala 2") ? "Sala 2" : 
                          s.includes("sala 3") ? "Sala 3" : null;

                if (key) {
                    salas[key].push({ 
                        title: f.Title || f.Asunto || "Actividad", 
                        startTime: `${String(inicio.getHours()).padStart(2,'0')}:${String(inicio.getMinutes()).padStart(2,'0')}`, 
                        sortTime: inicio.getTime(),
                        esEnCurso 
                    });
                }
            });

            // Ordenar por hora cada sala
            Object.keys(salas).forEach(k => salas[k].sort((a,b) => a.sortTime - b.sortTime));
            return salas;
        }

        function renderDashboard(salas) {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = Object.keys(salas).map(key => `
                <div class="room-card">
                    <div class="room-title-bar">
                        <strong>${key}</strong>
                        <span class="${salas[key].length > 0 ? 'badge-eventos' : 'badge-disponible'}">
                            ${salas[key].length > 0 ? salas[key].length + ' Eventos' : 'Disponible'}
                        </span>
                    </div>
                    <div class="meetings-list">
                        ${salas[key].length > 0 ? salas[key].map(m => `
                            <div class="meeting-item"><span class="time-box">${m.startTime}</span>
                            <div class="meeting-title">${m.title} ${m.esEnCurso ? '<span class="badge-en-curso">EN CURSO</span>' : ''}</div></div>
                        `).join('') : '<div style="text-align:center; color:#999; margin-top:100px; font-size:12px;">Sin reuniones hoy</div>'}
                    </div>
                </div>`).join('');
        }

        setInterval(() => {
            const n = getChileanDate();
            document.getElementById('liveDate').innerText = n.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('liveTime').innerText = n.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }, 1000);
        
        fetchSalasFromAPI();
        // 30 minutos
        setInterval(fetchSalasFromAPI, 1800000); 
    </script>
</body>
</html>
