<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor UGM - MODO EMERGENCIA</title>
    <style>
        body { background: #1b2a4a; color: white; font-family: sans-serif; padding: 20px; }
        .rooms-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .room-card { background: white; color: #333; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="status" style="text-align:center; margin-bottom: 20px;">Conectando...</div>
    <div class="rooms-grid" id="roomsContainer"></div>

    <script>
        let salasMapeadas = {};

        async function fetchSalas() {
            try {
                const response = await fetch('/api/salas?t=' + Date.now());
                if (!response.ok) throw new Error("Backend caído");
                const data = await response.json();
                processData(data.value || data);
            } catch (e) {
                document.getElementById('status').innerHTML = "<b>⚠️ SISTEMA EN MODO MANUAL</b>. Abre consola (F12) y usa: <code>crearReunion('Titulo', 'Sala', '19:00')</code>";
                // Inicializamos vacío para que no se vea roto
                initSalas();
                render();
            }
        }

        function initSalas() {
            salasMapeadas = {
                "Sala Junta Directiva": [], "Sala 1": [], "Sala 2": [], "Sala 3": []
            };
        }

        function processData(items) {
            initSalas();
            items.forEach(item => {
                const f = item.fields || item;
                const sala = (f.Sala || "").toString();
                const titulo = (f.Asunto || f.Title || "Evento").toString();
                const hora = (f.HoraInicio || f.casillaTiempo || "00:00").toString().substring(11, 16);
                
                let key = Object.keys(salasMapeadas).find(k => sala.toLowerCase().includes(k.toLowerCase().split(' ')[0]));
                if (key) salasMapeadas[key].push({ titulo, hora });
            });
            render();
        }

        window.crearReunion = function(titulo, sala, hora) {
            if(!salasMapeadas[sala]) salasMapeadas[sala] = [];
            salasMapeadas[sala].push({ titulo, hora });
            render();
        };

        function render() {
            const cont = document.getElementById('roomsContainer');
            cont.innerHTML = "";
            for(let [nombre, eventos] of Object.entries(salasMapeadas)) {
                cont.innerHTML += `<div class="room-card"><h3>${nombre}</h3><div class="list">${eventos.map(e => `<div>${e.hora} - ${e.titulo}</div>`).join('')}</div></div>`;
            }
        }

        fetchSalas();
    </script>
</body>
</html>
