<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Visor de Reuniones UGM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-image: url('FONDO PANTALLA REUNIÓN ALUMNI.png'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #f4f6f9; color: #333; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .main-header { background: rgba(27, 42, 74, 0.95); color: #ffffff; padding: 15px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 5px solid #dda126; }
        .header-left-block { display: flex; align-items: center; gap: 20px; }
        .header-logo { width: 65px; height: auto; object-fit: contain; }
        .header-text-group .title { font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .header-text-group .subtitle { font-size: 12px; color: #b0c4de; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
        .date-badge { background: rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; border: 1px solid rgba(255, 255, 255, 0.2); text-align: right; line-height: 1.3; }
        .live-time { color: #52b3e5; display: block; font-size: 16px; margin-top: 2px; }
        .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(48%, 1fr)); gap: 20px; flex-grow: 1; margin-bottom: 20px; }
        @media (max-width: 900px) { .rooms-grid { grid-template-columns: 1fr; } }
        .room-card { background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(5px); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); border-top: 5px solid #1b2a4a; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.2s; }
        .room-title-bar { background: rgba(248, 249, 250, 0.8); padding: 15px 20px; border-bottom: 1px solid #eef2f5; display: flex; justify-content: space-between; align-items: center; }
        .room-name { font-size: 16px; font-weight: bold; color: #1b2a4a; }
        .event-count { font-size: 11px; background: #1b2a4a; color: #fff; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .meetings-list { padding: 15px 20px; flex-grow: 1; overflow-y: auto; max-height: 280px; }
        .meeting-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
        .meeting-time { min-width: 95px; }
        .time-box { background: #e2e8f0; color: #1b2a4a; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; text-align: center; }
        .meeting-details { flex-grow: 1; padding-left: 15px; }
        .meeting-title { font-size: 14px; font-weight: bold; color: #2d3748; }
        .no-meetings { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 120px; color: #718096; font-style: italic; font-size: 13px; text-align: center; }
        .brand-bar { height: 5px; width: 100%; display: flex; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .brand-bar .color-1 { flex: 2; background-color: #1b2a4a; }
        .brand-bar .color-2 { flex: 1; background-color: #52b3e5; }
        .brand-bar .color-3 { flex: 1; background-color: #dda126; }
        .footer-text { text-align: center; margin-top: 10px; font-size: 11px; color: #ffffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-header">
        <div class="header-left-block">
            <img src="logo-blanco-celeste.png" alt="Logo UGM" class="header-logo">
            <div class="header-text-group">
                <div class="title">Visor de Reuniones UGM</div>
                <div class="subtitle">Universidad Gabriela Mistral — Vista General</div>
            </div>
        </div>
        <div class="date-badge">
            <span id="liveDate">Cargando fecha...</span>
            <span id="liveTime" class="live-time">00:00:00</span>
        </div>
    </div>

    <div class="rooms-grid" id="roomsContainer"></div>

    <div>
        <div class="brand-bar">
            <div class="color-1"></div>
            <div class="color-2"></div>
            <div class="color-3"></div>
        </div>
        <div class="footer-text">Universidad Gabriela Mistral — Construyendo Nuestra Huella</div>
    </div>

    <script>
        let salasMapeadas = {};

        function initSalas() {
            salasMapeadas = {
                "Sala Junta Directiva": { displayName: "Sala Junta Directiva", agenda: [] },
                "Sala 1": { displayName: "Sala 1", agenda: [] },
                "Sala 2": { displayName: "Sala 2", agenda: [] },
                "Sala 3": { displayName: "Sala 3", agenda: [] }
            };
        }

        function formatISODateToHHMM(isoString) {
            if (!isoString) return "00:00";
            try {
                const dateObj = new Date(isoString);
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            } catch (e) { return "00:00"; }
        }

        function parseField(value) {
            if (!value) return "";
            if (typeof value === 'object') return value.Value || value.Label || value.DisplayName || JSON.stringify(value);
            return String(value);
        }

        async function fetchSalasFromAPI() {
            try {
                const response = await fetch(`/api/salas?refresh=${Date.now()}`);
                const data = await response.json();
                if (data && data.value) processSharepointData(data.value);
            } catch (error) { console.error("Error en API:", error); }
        }

        function processSharepointData(items) {
            initSalas();

            // ORDENAMIENTO: Invertimos para que los ID más altos queden al principio
            if (Array.isArray(items)) {
                items.sort((a, b) => (parseInt(b.fields?.id || b.id || 0) - parseInt(a.fields?.id || a.id || 0)));
            }

            items.forEach((item, index) => {
                const fields = item.fields || item;
                if (!fields) return;

                const columnaSalaRaw = String(fields.Sala || "").toLowerCase().trim();
                const rawInicio = fields.HoraInicio || fields.EventDate || fields.Start;
                const rawFin = fields.HoraFin || fields.EndDate || fields.End;
                let nombreDeLaReunion = parseField(fields.Asunto || fields.Title).trim();

                let salaKey = "";
                if (columnaSalaRaw.includes("junta")) salaKey = "Sala Junta Directiva";
                else if (columnaSalaRaw.includes("sala 1")) salaKey = "Sala 1";
                else if (columnaSalaRaw.includes("sala 2")) salaKey = "Sala 2";
                else if (columnaSalaRaw.includes("sala 3")) salaKey = "Sala 3";

                if (salaKey) {
                    salasMapeadas[salaKey].agenda.push({
                        title: nombreDeLaReunion || "Actividad",
                        startTime: formatISODateToHHMM(rawInicio),
                        endTime: formatISODateToHHMM(rawFin)
                    });
                }
            });

            renderDashboard();
        }

        function renderDashboard() {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = "";
            Object.keys(salasMapeadas).forEach(key => {
                const sala = salasMapeadas[key];
                container.innerHTML += `
                    <div class="room-card">
                        <div class="room-title-bar">
                            <span class="room-name">${sala.displayName}</span>
                            <span class="event-count">${sala.agenda.length} Eventos</span>
                        </div>
                        <div class="meetings-list">
                            ${sala.agenda.map(m => `
                                <div class="meeting-item">
                                    <div class="meeting-time"><span class="time-box">${m.startTime}-${m.endTime}</span></div>
                                    <div class="meeting-details"><div class="meeting-title">${m.title}</div></div>
                                </div>`).join('')}
                        </div>
                    </div>`;
            });
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('liveDate').innerText = n.toLocaleDateString();
            document.getElementById('liveTime').innerText = n.toLocaleTimeString();
        }, 1000);
        
        fetchSalasFromAPI();
        setInterval(fetchSalasFromAPI, 15000);
    </script>
</body>
</html>
